name: many-notes

services:
    php:
        image: ${MANY_NOTES_IMAGE:-brufdev/many-notes:latest}
        restart: unless-stopped
        environment:
            - APP_URL=${APP_URL:-http://localhost}
            - YJS_ENABLED=true
            - YJS_JWT_SECRET=${YJS_JWT_SECRET:?Set YJS_JWT_SECRET in a .env file or the shell}
            - YJS_INTERNAL_TOKEN=${YJS_INTERNAL_TOKEN:?Set YJS_INTERNAL_TOKEN in a .env file or the shell}
            - YJS_INTERNAL_URL=http://yjs:1234
            - CACHE_STORE=file
            - DB_BUSY_TIMEOUT=5000
        volumes:
            - database:/var/www/html/database/sqlite
            - logs:/var/www/html/storage/logs
            - private:/var/www/html/storage/app/private
            - typesense:/var/www/html/typesense
        expose:
            - '8080'

    yjs:
        build:
            context: ./yjs-server
        restart: unless-stopped
        environment:
            - YJS_PORT=1234
            - YJS_DB_PATH=/data/yjs.sqlite
            - LARAVEL_DB_PATH=/laravel-db/database.sqlite
            - YJS_JWT_SECRET=${YJS_JWT_SECRET:?Set YJS_JWT_SECRET in a .env file or the shell}
            - YJS_INTERNAL_TOKEN=${YJS_INTERNAL_TOKEN:?Set YJS_INTERNAL_TOKEN in a .env file or the shell}
            - YJS_STORE_DEBOUNCE=2000
            - YJS_STORE_MAX_DEBOUNCE=10000
        volumes:
            - yjs:/data
            # Read-only access to the Laravel SQLite database for authorization.
            - database:/laravel-db:ro
        expose:
            - '1234'
        depends_on:
            - php
        healthcheck:
            test:
                [
                    'CMD',
                    'node',
                    '-e',
                    "fetch('http://127.0.0.1:1234/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
                ]
            interval: 15s
            timeout: 5s
            retries: 3
            start_period: 10s

    proxy:
        image: nginx:1.27-alpine
        restart: unless-stopped
        ports:
            - '${APP_PORT:-80}:80'
        volumes:
            - ./deploy/docker/nginx/many-notes-proxy.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - php
            - yjs

volumes:
    database:
    logs:
    private:
    typesense:
    yjs:
